<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylized particle collision diagram">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#eaf3fb"/>
      <stop offset="100%" stop-color="#cfe4f7"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#74b9ff"/>
      <stop offset="100%" stop-color="#2c81ba"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="100" height="100" rx="18" fill="url(#bg)"/>

  <!-- concentric detector rings -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#2c81ba" stroke-opacity="0.35" stroke-width="4"/>
  <circle cx="50" cy="50" r="30" fill="none" stroke="#2c81ba" stroke-opacity="0.5" stroke-width="3.5"/>

  <!-- particle tracks radiating from the collision point -->
  <g stroke-linecap="round" fill="none">
    <path d="M50,50 L18,22" stroke="#1a2a3a" stroke-width="3.2"/>
    <path d="M50,50 L12,58" stroke="#1a2a3a" stroke-width="3.2"/>
    <path d="M50,50 L28,88" stroke="#1a2a3a" stroke-width="3.2"/>
    <path d="M50,50 L74,90" stroke="#1a2a3a" stroke-width="3.2"/>
    <path d="M50,50 L90,62" stroke="#1a2a3a" stroke-width="3.2"/>
    <path d="M50,50 L88,20" stroke="#1a2a3a" stroke-width="3.2"/>

    <!-- curved tracks, as if bent by a magnetic field -->
    <path d="M50,50 Q34,28 22,10" stroke="#0984e3" stroke-width="4"/>
    <path d="M50,50 Q68,70 80,92" stroke="#0984e3" stroke-width="4"/>
  </g>

  <!-- collision point -->
  <circle cx="50" cy="50" r="11" fill="url(#core)" stroke="#1a2a3a" stroke-width="1.5"/>

  <!-- hit markers -->
  <g fill="#e74c3c">
    <circle cx="30" cy="30" r="3"/>
    <circle cx="20" cy="45" r="3"/>
    <circle cx="40" cy="75" r="3"/>
    <circle cx="68" cy="80" r="3"/>
    <circle cx="72" cy="35" r="3"/>
  </g>
</svg>
